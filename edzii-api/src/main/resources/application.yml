server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: edzii-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/edziinku}
    username: ${DATABASE_USER:edziinku}
    password: ${DATABASE_PASSWORD:edziinku}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

edzii:
  env: ${APP_ENV:dev}
  public-web-url: ${PUBLIC_WEB_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-32b-min!!}
    access-ttl-seconds: ${JWT_TTL:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL:604800}
  cors:
    origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:4173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  whatsapp:
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:edzii-verify-token}
    app-secret: ${WHATSAPP_APP_SECRET:}
    graph-version: ${WHATSAPP_GRAPH_VERSION:v21.0}
  storage:
    dir: ${UPLOAD_DIR:storage/uploads}
  weather:
    latitude: ${WEATHER_LATITUDE:6.1725}
    longitude: ${WEATHER_LONGITUDE:1.2314}

logging:
  level:
    tg.edziinku: INFO
    org.springframework.security: WARN
