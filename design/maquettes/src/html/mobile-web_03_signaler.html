<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Work Sans',sans-serif;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
body.dark{--bg:#030B1E;--bg2:#061433;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);--line:rgba(127,216,255,.13);--tx:#EAF6FF;--mut:#8FA6C8;--c:#5CE1F2;--b:#2F86E8;--ink:#03132f;background:radial-gradient(120% 60% at 70% -10%,#0E3470 0%,#061433 45%,#030B1E 100%);color:var(--tx)}
body.light{--bg:#F3F7FC;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#EEF4FB;--line:#DCE6F2;--tx:#071733;--mut:#5B6F8F;--c:#0E9DB8;--b:#2F86E8;--ink:#03132f;background:#F3F7FC;color:var(--tx)}
h1,h2,h3,h4,.sora{font-family:Sora,sans-serif;letter-spacing:-.02em}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.light .card{box-shadow:0 1px 2px rgba(7,23,51,.04),0 8px 24px -12px rgba(7,23,51,.12)}
.grad{background:linear-gradient(135deg,#2F86E8,#5CE1F2);color:#03132f}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--card2);color:var(--tx)}
.btn.p{background:linear-gradient(135deg,#2F86E8,#5CE1F2);color:#03132f;border:0;box-shadow:0 10px 24px -10px rgba(92,225,242,.6)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card2);color:var(--tx)}
.chip.on{background:rgba(92,225,242,.16);border-color:rgba(92,225,242,.6);color:var(--c)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
.r{background:rgba(255,92,122,.15);color:#FF8FA3}.a{background:rgba(245,184,75,.17);color:#E9A93A}.c{background:rgba(92,225,242,.14);color:var(--c)}.g{background:rgba(52,211,153,.15);color:#34D399}
.light .r{color:#E0435F}.light .a{color:#B97A12}.light .g{color:#0F9F6E}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.demo{position:absolute;right:16px;bottom:10px;font-size:11px;color:var(--mut);opacity:.75;z-index:50}
.sb{display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 36px;height:54px;font:600 16px 'Work Sans';position:relative;z-index:20}
.isl{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--tx);opacity:.55;z-index:30}
.mapw{position:relative;overflow:hidden}.mapw>svg{position:absolute;inset:0;width:100%;height:100%}
.inp{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:15px;color:var(--mut)}
.lab{font:600 14px Sora;margin-bottom:8px}
.lvls{display:flex;gap:10px}.lvl{flex:1;border-radius:18px;padding:12px 6px;text-align:center;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:14px;color:var(--tx)}
.lvl svg{display:block;margin:0 auto 6px}.lvl small{display:block;color:var(--mut);font-size:11px;font-weight:400;margin-top:2px}
.lvl.on{background:linear-gradient(160deg,rgba(47,134,232,.35),rgba(92,225,242,.15));border:1.5px solid var(--c);box-shadow:0 0 22px -8px #5CE1F2}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;display:flex;justify-content:space-around;padding-top:10px;border-top:1px solid var(--line);background:rgba(3,11,30,.88);backdrop-filter:blur(20px);z-index:25}
.light .tabbar{background:rgba(255,255,255,.92)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut);width:70px}.tabbar .on{color:var(--c)}
.tabbar .fab{width:54px;height:54px;border-radius:18px;margin-top:-6px;justify-content:center;color:#03132f;background:linear-gradient(135deg,#2F86E8,#5CE1F2);box-shadow:0 10px 24px -8px rgba(92,225,242,.7)}
.pinm{position:absolute;transform:translate(-50%,-100%);z-index:5}

.nav{display:flex;align-items:center;gap:28px;padding:22px 56px;position:relative;z-index:5}.nav .br{display:flex;align-items:center;gap:10px;font:700 20px Sora;margin-right:auto}.nav a{font-size:15px;color:var(--mut)}.nav a.on{color:var(--tx)}
.shell{display:grid;grid-template-columns:232px 1fr;height:900px}
.side{border-right:1px solid var(--line);background:rgba(255,255,255,.02);padding:24px 16px;position:relative}.side .br{display:flex;gap:10px;align-items:center;font:700 20px Sora;margin:0 6px 30px}
.side a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;color:var(--mut);font-size:14.5px;margin-bottom:3px}.side a.on{background:linear-gradient(90deg,rgba(92,225,242,.18),rgba(47,134,232,.06));color:var(--tx);box-shadow:inset 3px 0 #5CE1F2}
.side .n{margin-left:auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:#FF5C7A;color:#fff}
.side .who{position:absolute;left:16px;right:16px;bottom:20px;display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:600 13px Sora;color:#03132f;background:linear-gradient(135deg,#2F86E8,#5CE1F2);flex:none}
.main{padding:22px 28px;display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0;position:relative}
.hd{display:flex;align-items:center;gap:14px}.hd h1{font-size:25px;font-weight:600}.hd .sub{font-size:13px;color:var(--mut);margin-top:3px}
.alertpill{display:flex;gap:9px;align-items:center;padding:9px 14px;border-radius:99px;background:rgba(255,92,122,.12);border:1px solid rgba(255,92,122,.4);color:#FFB3C1;font-size:13.5px;font-weight:600}
.k{padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line)}.k p{font-size:13px;color:var(--mut)}.k b{display:block;font:600 30px Sora;margin:6px 0 2px;letter-spacing:-.03em}.k s{text-decoration:none;font-size:12.5px;color:var(--c)}
.k.hl{background:linear-gradient(140deg,#2F86E8,#5CE1F2);border:0;color:#03132f}.k.hl p,.k.hl s{color:#06244f}
.ch{font:600 15px Sora;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.ch span{font:400 12px 'Work Sans';color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-weight:600;font-size:12px;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.th{width:44px;height:44px;border-radius:10px;background-size:cover;background-position:center}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07)}.bar i{display:block;height:100%;border-radius:9px}
.ab{width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--card2);margin-left:6px}
.urlbar{position:absolute;left:12px;right:12px;bottom:28px;height:46px;border-radius:16px;background:rgba(40,48,64,.92);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:#fff;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4)}
